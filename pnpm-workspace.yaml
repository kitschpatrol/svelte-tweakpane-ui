packages:
  - .
  - docs
overrides:
  # Override ancient version from @html-eslint/eslint-plugin
  '@eslint/plugin-kit': ~0.7.2
  # Svelte Kit has old insecure version
  cookie: ~1.1.1
  # 0.27.7 is too far...
  # 0.27.6 does not exist?
  esbuild: 0.27.5
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - case-police
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
allowBuilds:
  canvas: true
  esbuild: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@astrojs/starlight@0.41.10'
  - '@cloudflare/workerd-darwin-64@1.20260828.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260828.1'
  - '@cloudflare/workerd-linux-64@1.20260828.1'
  - '@cloudflare/workerd-linux-arm64@1.20260828.1'
  - '@cloudflare/workerd-windows-64@1.20260828.1'
  - miniflare@5.20260828.0-alpha
  - workerd@1.20260828.1
  - wrangler@4.127.1
