allowBuilds:
  canvas: true
  esbuild: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@kitschpatrol/cspell-config@8.14.0'
  - '@kitschpatrol/eslint-config@8.14.0'
  - '@kitschpatrol/knip-config@8.14.0'
  - '@kitschpatrol/mdat-config@8.14.0'
  - '@kitschpatrol/prettier-config@8.14.0'
  - '@kitschpatrol/remark-config@8.14.0'
  - '@kitschpatrol/repo-config@8.14.0'
  - '@kitschpatrol/shared-config@8.14.0'
  - '@kitschpatrol/stylelint-config@8.14.0'
  - '@kitschpatrol/tweakpane-plugin-camerakit@0.3.1-fork.1'
  - '@kitschpatrol/tweakpane-plugin-essentials@0.2.2-fork.1'
  - '@kitschpatrol/tweakpane-plugin-file-import@1.2.0-fork.1'
  - '@kitschpatrol/tweakpane-plugin-image@2.0.1-fork.1'
  - '@kitschpatrol/tweakpane-plugin-inputs@1.0.4-fork.1'
  - '@kitschpatrol/tweakpane-plugin-profiler@0.4.2-fork.1'
  - '@kitschpatrol/tweakpane-plugin-rotation@0.2.1-fork.1'
  - '@kitschpatrol/tweakpane-plugin-textarea@2.0.1-fork.1'
  - '@kitschpatrol/tweakpane-plugin-waveform@1.0.4-fork.1'
  - '@kitschpatrol/typescript-config@8.14.0'
  - mdat@3.6.6
  - remark-mdat@3.1.2
overrides:
  # Svelte Kit 2 declares cookie ^0.6.0 (GHSA-pxg6-pf52-xh8x); 1.1.x keeps the parse/serialize aliases Kit 2 imports
  '@sveltejs/kit@2>cookie': ~1.1.1
  # Vite 5 declares esbuild ^0.21.3 (GHSA-67mh-4wv8-2f99); esbuild 0.27.7+ fails Vite 5 builds
  # with "Transforming destructuring to the configured target environment is not supported yet"
  'vite@5>esbuild': 0.27.5
packages:
  - .
  - docs
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
permissions:
  '@kitschpatrol/shared-config':
    skills: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - case-police
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
skills:
  dirs:
    - .agents/skills
    - .claude/skills
